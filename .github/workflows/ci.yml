name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: lex-transcript-search tests
        working-directory: plugins/lex-transcript-search/skills/lex-transcript-search
        run: python -m unittest test_search.py
      - name: youtube-digest tests
        working-directory: plugins/youtube-digest
        run: |
          pip install -q -r requirements.txt
          PYTHONPATH=. python -m pytest -q tests
      - name: shell syntax
        run: bash -n plugins/mdp/bin/mdp plugins/youtube-digest/bin/ytdigest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Run the binary rather than gitleaks-action: the action scans `<first-sha>^..<last-sha>`,
      # which fails on a push that includes the root commit.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact -v
